<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	<H2> Computer Specs</H2>

		Windows Version
		<input id='windows' type='text'>
		Installed Ram
		<input id='ram' type='text'>
		Graphics Card
		<input id='graphics' type='text'>
		Storage
		<input id='storage' type='text'>
		Processor
		<input id='processor' type='text'>	



		<button type="button" onclick="clickButton( 
		document.getElementById('windows').value,
		document.getElementById('ram').value,
		document.getElementById('graphics').value,
		document.getElementById('storage').value,
		document.getElementById('processor').value)">Submit</button>

		<button type='button' onclick="window.location.href = 'login.html'" >
			logout
		</button>

		<script>



		const clickButton = (a,b,c,d,e) =>{

			const postData = {
				windows:a,
				ram:b,
				graphics:c,
				storage:d,
				processor:e
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/specs',data);
					console.log(response)
					if (response.data.status =='success') {
						document.location.href = 'profile.html.html';
					} else {
						throw new Error('Failed to fetch data');
					}
				} catch (error) {
					console.error('Error:', error); 
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
