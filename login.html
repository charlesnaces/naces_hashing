<!DOCTYPE html>
<html>
	<head>
		<title>Page Title</title>
		<link rel="stylesheet" href="styles.css">
		<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
	</head>

	<body>

	<H2> Login Page</H2>

		Username
		<input id='username' type='text'>
		Password
		<input id='password' type='password'>
	



		<button type="button" onclick="clickButton( 
		document.getElementById('username').value,
		document.getElementById('password').value)">Login</button>

		<button type='button' onclick="window.location.href = 'index.html'" >
			Register
		</button>

		<p id="login-error"></p>

		<script>



		const clickButton = (a,b) =>{
			const error = document.getElementById('login-error');
			error.textContent = '';

			const postData = {
				username:a,
				password:b
		
			};

			const data = {
				method: 'POST',
				headers: {
					'Content-Type': 'application/json'
				},
				body: JSON.stringify(postData)
			}
	
			async function fetchData() {
				try {
					const response = await fetch('http://127.0.0.1:8000/usersLogin',data);
					if (!response.ok) {
						throw new Error('Login failed');
					}
					const result = await response.json();
					if (result.status == 'success') {
						document.location.href = 'computer.html';
					} else {
						error.textContent = 'Wrong username or password.';
					}
				} catch {
					error.textContent = 'Could not log in. Try again.';
				}
			}

			fetchData()
	
		}

		</script>
	</body>
</html>
